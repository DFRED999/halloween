<!doctype html>
<html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#7a2cff">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style>
<title>טריק או טריט בנווה אפק</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700;800&family=Rubik+Wet+Paint&display=swap">
<style>
/* Layout: two looks: white/pumpkin split map by day, black/orange by night; the map takes the stage, a slim checklist rides beside it */
:root{
  --ink:#0a0809; --ink-2:#161113; --ink-3:#221a1b; --edge:#3b2a22;
  --orange:#ff7a0f; --orange-hi:#ffa346; --orange-lo:#a8470a; --bone:#f6eadb; --ash:#b7a593;
  --slime:#8cff2e; --warn:#ffd23f; --violet:#b48cff;
  --f-display:"Rubik Wet Paint","Assistant",system-ui,sans-serif;
  --f-body:"Assistant","Segoe UI","Arial Hebrew",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--ink);color:var(--bone)}
body{font-family:var(--f-body);font-size:16px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 32px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--ink)}
.wrap{max-width:1500px;margin:0 auto}
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:10px 20px;padding-block:16px 12px}
h1{font-family:var(--f-display);font-weight:400;font-size:clamp(30px,6vw,52px);line-height:1;margin:0;color:var(--orange);text-wrap:balance;
  text-shadow:0 0 18px color-mix(in srgb,var(--orange) 45%,transparent)}
.where{margin:6px 0 0;color:var(--ash);font-size:14px;font-weight:600}
.tools{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.seg{display:inline-flex;border:1.5px solid var(--orange);border-radius:12px;overflow:hidden}
.seg button{border:0;background:transparent;color:var(--orange);font:700 15px var(--f-body);padding:8px 14px;cursor:pointer;display:flex;flex-direction:column;align-items:center;line-height:1.15}
.seg button small{font-size:11px;font-weight:600;opacity:.85}
.seg button[aria-pressed="true"]{background:var(--orange);color:var(--ink)}
.seg button:focus-visible,.ctrl button:focus-visible,.stop button:focus-visible,.stop a:focus-visible{outline:2px solid var(--bone);outline-offset:2px}
.prog{display:flex;align-items:center;gap:8px;color:var(--ash);font-size:13px}
.prog b{color:var(--bone);font-size:20px;font-variant-numeric:tabular-nums}
.bar{width:70px;height:6px;border-radius:3px;background:var(--ink-3);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--orange);transition:width .3s}

.layout{display:grid;gap:16px}
@media (min-width:960px){.layout{grid-template-columns:minmax(0,1fr) 290px;align-items:start}.listcol{position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px)}}
.mapcol,.listcol{min-width:0}
.mapbox{position:relative;border-radius:16px;overflow:hidden;border:1.5px solid var(--orange-lo);background:var(--ink);
  box-shadow:0 0 0 1px #000,0 0 40px -10px color-mix(in srgb,var(--orange) 40%,transparent)}
#map{display:block;width:100%;height:auto;aspect-ratio:892/693;touch-action:none;cursor:grab;user-select:none}
@media (max-width:640px){.ctrl button{width:32px;height:32px;font-size:17px}}
#map.drag{cursor:grabbing}
.ctrl{position:absolute;bottom:10px;left:10px;display:flex;flex-direction:column;gap:6px}
.ctrl button{width:38px;height:38px;border-radius:10px;border:1px solid var(--orange-lo);background:color-mix(in srgb,var(--ink) 85%,transparent);color:var(--orange);font:800 20px/1 var(--f-body);cursor:pointer}

/* ---- map ---- */
.ground{fill:#050404}
.park{fill:#122015} .pitch,.school,.lot{fill:#140f0e} .bld{fill:#1d1513;stroke:#2c1f19;stroke-width:.6}
[class^="c-"]{fill:none;stroke:#000;stroke-linecap:round;stroke-linejoin:round}
[class^="w-"]{fill:none;stroke:var(--orange);stroke-linecap:round;stroke-linejoin:round}
.c-v{stroke-width:7}.w-v{stroke-width:5;stroke:var(--orange-lo)}
.c-l{stroke-width:12}.w-l{stroke-width:10}
.c-r{stroke-width:13}.w-r{stroke-width:11}
.c-t{stroke-width:18}.w-t{stroke-width:16;stroke:var(--orange-hi)}
.c-s{stroke-width:20}.w-s{stroke-width:18;stroke:var(--orange-hi)}
.w-f{stroke:var(--orange-lo);stroke-width:1.6;stroke-dasharray:3 2.5}
.sl{fill:#140800;font:800 7.6px var(--f-body);text-anchor:middle;pointer-events:none}

.routeset{display:none}.routeset.on{display:inline}
.glow{fill:none;stroke:var(--slime);stroke-width:14;stroke-opacity:.2;stroke-linecap:round;stroke-linejoin:round}
.leg{fill:none;stroke:var(--slime);stroke-width:4.4;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:10 5;animation:march 1.4s linear infinite}
@keyframes march{to{stroke-dashoffset:-15}}
@media (prefers-reduced-motion:reduce){.leg{animation:none}}
.chev{fill:none;stroke:#062000;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.pin{cursor:pointer}
.pin .nb{fill:var(--ink);stroke:var(--slime);stroke-width:2.2}
.pin .nt{fill:var(--slime);font:800 13px var(--f-body);text-anchor:middle}
.pin .ring{fill:var(--ink);stroke:var(--slime);stroke-width:3.2}
.pin .halo{fill:var(--slime);opacity:.28;animation:pulse 1.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pulse{50%{opacity:.08;transform:scale(1.18)}}
@media (prefers-reduced-motion:reduce){.pin .halo{animation:none}}
.pin.done .halo{display:none}
.pin.done use{filter:grayscale(1) brightness(.55)}
.pin.active .nb{fill:var(--slime)}.pin.active .nt{fill:var(--ink)}
.tag rect{fill:var(--ink);stroke:var(--slime);stroke-width:2.4}
.tag text{fill:var(--bone);font:800 13.5px var(--f-body);text-anchor:middle}
.tag .apt{font-weight:700;font-size:11px;fill:var(--orange-hi)}
.tag.done{opacity:.5}
.term .disk{fill:var(--slime);stroke:#000;stroke-width:1.5}
.term text{font:800 9.5px var(--f-body);text-anchor:middle;fill:#062000}
.xing .tri{fill:var(--warn);stroke:#000;stroke-width:1.2}
.xing text{font:900 9px var(--f-body);text-anchor:middle;fill:#000}
.deco{pointer-events:none}
.float{animation:bob 3.2s ease-in-out infinite;transform-box:fill-box}
.flap{animation:flap .5s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:center}
@keyframes bob{50%{transform:translateY(-5px)}}
@keyframes flap{to{transform:scaleY(.6)}}
@media (prefers-reduced-motion:reduce){.float,.flap{animation:none}}

.info{display:grid;gap:12px;margin-top:12px}
@media (min-width:760px){.info{grid-template-columns:minmax(0,1fr) minmax(0,1.2fr)}}
.card{background:var(--ink-2);border:1px solid var(--edge);border-radius:12px;padding:12px 14px}
.card h2{margin:0 0 6px;font-size:15px;letter-spacing:.02em}
.facts{display:flex;flex-wrap:wrap;gap:4px 16px;color:var(--ash);font-size:14px}
.facts b{color:var(--bone);font-variant-numeric:tabular-nums;font-size:16px}
#blurb{margin:8px 0 0;font-size:14px;color:var(--bone)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:10px;font-size:12.5px;color:var(--ash);align-items:center}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{display:inline-block;width:22px;border-top:3.5px dashed var(--slime)}
.sw2{display:inline-block;width:22px;height:7px;border-radius:4px;background:var(--orange);border:1px solid var(--bone)}
.safety{border-color:color-mix(in srgb,var(--warn) 55%,var(--edge))}
.safety h2{color:var(--warn)}
.safety ul{margin:0;padding-inline-start:18px;font-size:14px}
.safety li+li{margin-top:3px}

.listcol h2.sec{font-size:12px;letter-spacing:.14em;color:var(--ash);margin:0 2px 8px;font-weight:800}
ol.stops{list-style:none;margin:0;padding:0}
.stop{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:0 10px;align-items:center;padding:7px 9px;border-radius:10px;
  background:var(--ink-2);border:1px solid var(--edge);cursor:pointer}
.walk{margin-inline-start:14px;padding:3px 0 3px 0;padding-inline-start:18px;border-inline-start:2px dashed color-mix(in srgb,var(--slime) 50%,transparent);
  font-size:11.5px;color:var(--ash);font-variant-numeric:tabular-nums}
.badge{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font:800 15px var(--f-body);background:var(--orange);color:var(--ink)}
.stop.term .badge{background:var(--slime);color:#062000;font-size:10px}
.stop .nm{min-width:0}
.stop h3{margin:0;font-size:15.5px;font-weight:800;line-height:1.2}
.stop p{margin:0;font-size:12.5px;color:var(--ash)}
.acts{display:flex;gap:5px}
.acts a,.chk{width:32px;height:32px;display:grid;place-items:center;border-radius:8px;border:1px solid var(--edge);color:var(--ash);text-decoration:none;font:800 15px var(--f-body);background:transparent;cursor:pointer}
.chk{border-color:var(--orange-lo);color:var(--orange)}
.stop.done{opacity:.62}.stop.done .badge{background:#4a3b33;color:var(--bone)}
.stop.done h3{text-decoration:line-through;text-decoration-color:var(--orange);text-decoration-thickness:2px}
.stop.done .chk{background:var(--orange);color:var(--ink)}
.stop.sel{border-color:var(--slime)}
.reset{margin-top:10px;background:none;border:0;color:var(--ash);font:600 13px var(--f-body);text-decoration:underline;cursor:pointer;padding:4px}
footer{margin-top:22px;color:var(--ash);font-size:12px}

.seg.look button{font-size:13.5px;padding:7px 11px}
.zone,.cc{display:none}
use[href="#bat"]{color:#ff8a1f} .webc{color:#ff7a0f}
/* ---- day look: white north, pumpkin-orange south, split along Neve Afikim road ---- */
:root[data-look="day"]{--ink:#ffffff;--ink-2:#fff6ec;--ink-3:#f3e6d8;--edge:#f2c79c;--bone:#1c1420;--ash:#6e5a52;
  --orange:#f26a00;--orange-hi:#ff9a3c;--orange-lo:#c95300;--slime:#7a2cff;--warn:#ffcc1a;color-scheme:light}
[data-look="day"] h1{text-shadow:2px 2px 0 #1c1420}
[data-look="day"] .mapbox{border-color:#1c1420;box-shadow:6px 6px 0 #1c1420}
[data-look="day"] .ground{fill:#ffffff}
[data-look="day"] .zone{display:inline;fill:#ffc58a}
[data-look="day"] .cc{display:inline;fill:none;stroke:#ffd23f;stroke-width:6;stroke-dasharray:12 8;stroke-linecap:butt}
[data-look="day"] .park{fill:#bfe6a8;fill-opacity:.85} [data-look="day"] .pitch,[data-look="day"] .school,[data-look="day"] .lot{fill:#5a2d82;fill-opacity:.06}
[data-look="day"] .bld{fill:#5a2d82;fill-opacity:.12;stroke:#5a2d82;stroke-opacity:.25}
[data-look="day"] [class^="c-"]{stroke:#1c1420}
[data-look="day"] [class^="w-"]{stroke:#ffffff}
[data-look="day"] .w-t,[data-look="day"] .w-s{stroke:#1c1420}
[data-look="day"] .w-v{stroke:#fff3e6}
[data-look="day"] .w-f{stroke:#8a5a3a;stroke-width:1.4}
[data-look="day"] .sl{fill:#1c1420}
[data-look="day"] .sl-t,[data-look="day"] .sl-s{fill:#ffffff}
[data-look="day"] .glow{stroke-opacity:.18}
[data-look="day"] .chev{stroke:#ffffff}
[data-look="day"] .pin .nb{fill:#fff;stroke:var(--slime)} [data-look="day"] .pin .nt{fill:var(--slime)}
[data-look="day"] .pin.active .nb{fill:var(--slime)} [data-look="day"] .pin.active .nt{fill:#fff}
[data-look="day"] .tag rect{fill:#fff;stroke:var(--slime)}
[data-look="day"] .pin .ring{fill:#fff}
[data-look="day"] .term text{fill:#fff} [data-look="day"] .term .disk{stroke:#1c1420}
[data-look="day"] .pin.done use{filter:grayscale(1) opacity(.6)}
[data-look="day"] use[href="#bat"]{color:#1c1420} [data-look="day"] .webc{color:#1c1420}
[data-look="day"] .stop.term .badge{color:#fff}
[data-look="day"] .walk{border-color:color-mix(in srgb,var(--slime) 45%,transparent)}
[data-look="day"] .stop.done .badge{background:#d9cfc6;color:#1c1420}
[data-look="day"] .sw{border-top-color:var(--slime)}

.next{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 14px;
  margin-block:4px 6px;padding:12px 14px;border-radius:14px;background:var(--slime);color:#fff;box-shadow:0 6px 0 #1c1420}
.next small{font-size:13px;font-weight:700;opacity:.9}.next h2{margin:0;font-size:24px;line-height:1.15;font-weight:800}.next p{margin:0;font-size:14px;opacity:.9}
.nbtns{display:flex;gap:8px}.btn{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 16px;border-radius:12px;border:2px solid #fff;
  color:#fff;background:transparent;font:800 16px var(--f-body);text-decoration:none;cursor:pointer}.btn.primary{background:#fff;color:var(--slime)}
.next.fin{background:var(--orange)}
.sync{display:flex;align-items:center;gap:6px;margin:0 2px 8px;font-size:12.5px;color:var(--ash)}.sync i{width:8px;height:8px;border-radius:50%;background:#aaa}.sync.on i{background:#2bb34a}
.pin.nextup .ring{stroke:var(--orange);stroke-width:4.5}.pin.nextup .halo{fill:var(--orange);opacity:.45}
.me-acc{fill:#2f7dff;fill-opacity:.15;stroke:#2f7dff;stroke-opacity:.5}.me-dot{fill:#2f7dff;stroke:#fff;stroke-width:3}
@media (max-width:640px){#map{aspect-ratio:4/5!important}.ctrl{flex-direction:row}}
.gpsnote{position:absolute;top:10px;right:10px;max-width:70%;font-size:12.5px;background:var(--ink);color:var(--bone);border:1px solid var(--edge);border-radius:8px;padding:4px 8px}
</style>

</head><body>
<div class="wrap" dir="rtl">
<header>
  <div>
    <h1>טריק או טריט בנווה אפק</h1>
    <p class="where">מסלול הליכה לילדים · ראש העין · הלווין 2026</p>
  </div>
  <div class="tools">
    <div class="seg" role="group" aria-label="בחירת מסלול">
      <button id="bA" aria-pressed="true">מסלול א׳<small id="tA"></small></button>
      <button id="bB" aria-pressed="false">מסלול ב׳<small id="tB"></small></button>
    </div>
    <div class="seg look" role="group" aria-label="צבעי המפה">
      <button id="lDay" aria-pressed="true">☀ לבנה</button>
      <button id="lNight" aria-pressed="false">☾ לילה</button>
    </div>
    <div class="prog" aria-live="polite"><b id="pc">0/8</b><div class="bar"><i id="pb"></i></div>בתים</div>
  </div>
</header>

<div class="next" id="next" aria-live="polite">
  <div class="ninfo"><small id="nextLbl"></small><h2 id="nextName"></h2><p id="nextSub"></p></div>
  <div class="nbtns"><a id="nextNav" class="btn" target="_blank" rel="noopener">ניווט ↗</a><button id="nextDone" class="btn primary" type="button">הגענו ✓</button></div>
</div>
<p class="sync off" id="sync"><i></i><span>מתחבר…</span></p>
<div class="layout">
  <section class="mapcol" aria-label="מפת המסלול">
    <div class="mapbox">

(function(){const K=Math.cos(32.093*Math.PI/180)*111320;let watch=null,acc,dot,first=true;
